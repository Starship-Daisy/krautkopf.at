name: Generate Blog Articles

on:
  push:
    paths:
      - 'data/articles.json'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install jinja2

      - name: Generate HTML files
        run: |
          python3 << 'EOF'
          import json
          import os
          from jinja2 import Template
          from datetime import datetime

          # Artikel aus JSON laden
          with open('data/articles.json', 'r', encoding='utf-8') as f:
              articles = json.load(f)

          # Template für die Detailseite
          template_str = '''<!DOCTYPE html>
          <html lang="de">
          <head>
              <script defer src="https://cloud.umami.is/script.js" data-website-id="b8c1b257-c6f9-4816-9e2d-eae8342a8885"></script>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{{ title }} – Blog</title>
              <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
              <link rel="preconnect" href="https://fonts.bunny.net">
              <link href="https://fonts.bunny.net/css?family=inter:400,700|lora:400,700|comforter-brush:400|praise:400|Alice:400;|open-sans:300" rel="stylesheet">
              <link rel="stylesheet" href="../../css/style.css">
          </head>
          <body>
              <header class="main-header">
                  <div class="container header-grid">
                      <div class="header-left">
                          <div class="back-to-home">
                              <a href="../../index.html">krautkopf.at</a>
                          </div>
                      </div>
                      <div class="header-center">
                          <div class="brand-wrapper">
                              <div class="kraut-logo-icon"></div>
                              <div class="header-text">
                                  <h1>{{ title }}</h1>
                                  <p>Inspiration, Fokus & Aktion</p>
                              </div>
                          </div>
                      </div>
                      <div class="header-right"></div>
                  </div>
              </header>

              <main class="blog-detail">
                  <article class="article-body">
                      <p class="lead">{{ lead }}</p>

                      {% if image_url %}
                      <section class="article-references">
                          <div class="container--narrow">
                              <h3 class="references-title">Bildnachweis & Inspiration</h3>
                              <div class="reference-vertical">
                                  <div class="featured-image-panorama">
                                      <img src="{{ image_url }}" alt="{{ image_alt }}" class="ref-img">
                                  </div>
                                  <div class="reference-text">
                                      <p class="image-caption"><strong>Motiv:</strong> "{{ image_caption or image_alt }}"</p>
                                  </div>
                              </div>
                          </div>
                      </section>
                      {% endif %}

                      <div class="article-text">
                          {{ content | safe }}

                          {% if references %}
                          <div class="article-references-list">
                              <h4>Querverweise</h4>
                              <ul class="reference-list">
                                  {% for ref in references.split('\\n') if ref.strip() %}
                                  <li>{{ ref.strip() }}</li>
                                  {% endfor %}
                              </ul>
                          </div>
                          {% endif %}
                      </div>
                  </article>
              </main>

              <footer class="main-footer">
                  <div class="container">
                      <div class="footer-contact">
                          <a href="mailto:wolfgang@krautkopf.at">wolfgang@krautkopf.at</a>
                      </div>
                      <nav class="footer-nav">
                          <a href="../../impressum.html">Impressum</a>
                          <a href="../../datenschutz.html">Datenschutz</a>
                          <a href="../../hirn-werkstatt.html">Hirnwerkstatt</a>
                          <a href="../../garten-werkstatt.html">Garten Werkstatt</a>
                          <a href="../../kontakt.html">Kontakt</a>
                          <a href="../../gedanken-werkstatt.html">Gedanken-Werkstatt</a>
                      </nav>
                      <p class="copyright">&copy; 2026 krautkopf</p>
                  </div>
              </footer>
          </body>
          </html>'''

          template = Template(template_str)
          os.makedirs('static/blog', exist_ok=True)
          generated_files = []
          
          for article in articles:
              if not article.get('file'):
                  print(f"⚠️  Artikel '{article.get('title')}' hat keinen Dateinamen – überspringe.")
                  continue
              
              html_content = template.render(
                  title=article['title'],
                  subtitle=article.get('subtitle', ''),
                  lead=article.get('lead', ''),
                  content=article['content'],
                  image_url=article.get('image_url', ''),
                  image_alt=article.get('image_alt', ''),
                  image_caption=article.get('image_caption', ''),
                  references=article.get('references', '')
              )
              
              file_path = f'static/blog/{article["file"]}'
              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(html_content)
              
              generated_files.append(file_path)
              print(f"✅ Generiert: {file_path}")

          # Status aktualisieren
          now = datetime.now()
          for article in articles:
              publish_date = datetime.fromisoformat(article['publish_date'].replace('Z', '+00:00'))
              expiry_date = article.get('expiry_date')
              
              if now < publish_date:
                  article['status'] = 'scheduled'
              elif expiry_date and now > datetime.fromisoformat(expiry_date.replace('Z', '+00:00')):
                  article['status'] = 'expired'
              else:
                  article['status'] = 'published'

          with open('data/articles.json', 'w', encoding='utf-8') as f:
              json.dump(articles, f, indent=2, ensure_ascii=False)

          print(f"\n📊 {len(generated_files)} HTML-Dateien generiert")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add static/blog/* data/articles.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "🤖 Automatisch generierte Blog-Artikel [skip ci]"
            git push
          else
            echo "Keine Änderungen"
          fi