name: Redaktion

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Dateiname des Artikels"
        required: true
        type: string
      content:
        description: "Artikel als JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  save:
    name: Artikel speichern
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Artikeldatei erzeugen
        env:
          ARTICLE_FILENAME: ${{ inputs.filename }}
          ARTICLE_CONTENT: ${{ inputs.content }}
        run: |
          mkdir -p 03_content/artikel

          printf '%s' "$ARTICLE_CONTENT" > "03_content/artikel/$ARTICLE_FILENAME"

      - name: Artikel pruefen
        env:
          ARTICLE_FILENAME: ${{ inputs.filename }}
        run: |
          python -m json.tool "03_content/artikel/$ARTICLE_FILENAME" > /dev/null

      - name: Artikel in GitHub speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 03_content/artikel/

          if git diff --cached --quiet; then
            echo "Keine Aenderung vorhanden."
          else
            git commit -m "Redaktion: Artikel gespeichert"
            git push
          fi